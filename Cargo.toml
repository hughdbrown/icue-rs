[workspace]
resolver = "3"
members = [
    "apps/edgectl",
    "apps/edgehost",
    "crates/edge-layout",
    "crates/edge-plugins",
    "crates/edge-store",
    "crates/icuew-manifest",
    "crates/llm-usage",
    "crates/widget-runtime",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
edge-layout = { path = "crates/edge-layout" }
edge-plugins = { path = "crates/edge-plugins" }
edge-store = { path = "crates/edge-store" }
icuew-manifest = { path = "crates/icuew-manifest" }
llm-usage = { path = "crates/llm-usage" }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }
widget-runtime = { path = "crates/widget-runtime" }
wry = "0.57"

[workspace.lints.clippy]
expect_used = "warn"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# Crate names already prefix most items (e.g. `edge_layout::LayoutError`); repeating is clearer.
module_name_repetitions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
