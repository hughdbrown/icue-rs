[package]
name = "llm-usage"
description = "Quota left and reset times of LLM subscriptions (Claude, Codex, Gemini, Kimi, Ollama)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
jiff = { version = "0.2", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via native-tls; writes the Claude Code Keychain item.
security-framework = "3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
