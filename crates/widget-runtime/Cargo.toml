[package]
name = "widget-runtime"
description = "Hosts iCUE HTML widgets in WKWebViews: injection shim, icuew:// assets, Edge surface"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
edge-layout.workspace = true
edge-plugins.workspace = true
icuew-manifest.workspace = true
serde.workspace = true
serde_json.workspace = true
tao.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
uuid.workspace = true
wry.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via tao; used for EDID vendor/model numbers.
core-graphics = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
# Same major version tao uses, for the gtk::Fixed that hosts child web views.
gtk = "0.18"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
